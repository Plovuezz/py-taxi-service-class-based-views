{% extends "base.html" %}


{% block content %}
  <h1>Our available cars!</h1>
  <hr>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li><i class="bi bi-car-front"></i>  <a href="{% url 'taxi:car-detail' car.pk %}">{{ car.model }} - {{ car.manufacturer.country }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No cars available at the moment (...</p>
  {% endif %}
{% endblock %}
